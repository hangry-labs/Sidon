[project]
name = "sidon"
version = "0.1.0"
description = "Local two-speaker audio separation with MossFormer2"
readme = "README.md"
authors = [
    { name = "Wataru Nakata", email = "wataru9871@gmail.com" }
]
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "licenses/Sidon-upstream-MIT.txt", "licenses/ClearerVoice-Apache-2.0.txt", "licenses/FLASH-MIT.txt", "licenses/SpeechBrain-Apache-2.0.txt", "licenses/MossFormer2-MODEL-CARD.md"]
dependencies = [
    "torch==2.8.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "soundfile==0.13.1",
    "einops==0.8.1",
    "rotary-embedding-torch==0.8.3",
    "huggingface-hub==0.36.0",
]

[project.scripts]
sidon-separate = "sidon.inference.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Package only the inference runtime and its required notices.
[tool.hatch.build.targets.wheel]
only-include = ["src/sidon/__init__.py", "src/sidon/inference"]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"RUNTIME_NOTICES.md" = "sidon/inference/NOTICE.md"

[tool.hatch.build.targets.sdist]
only-include = ["src/sidon/__init__.py", "src/sidon/inference", "pyproject.toml", "README.md", "LICENSE", "RUNTIME_NOTICES.md", "THIRD_PARTY_NOTICES.md", "licenses/ClearerVoice-Apache-2.0.txt", "licenses/FLASH-MIT.txt", "licenses/SpeechBrain-Apache-2.0.txt", "docs", "tests/test_mossformer.py"]

[dependency-groups]
dev = ["pytest==8.4.2", "build>=1.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
