[project]
name = "sidon"
version = "1.0.0"
description = "Hangry Labs Sidon: local voice restoration and speaker separation"
readme = "README.md"
authors = [
    { name = "Wataru Nakata", email = "wataru9871@gmail.com" }
]
maintainers = [{ name = "Hangry Labs", email = "contact@hangrylabs.app" }]
requires-python = ">=3.13,<3.14"
license = "Apache-2.0 AND MIT AND ISC"
license-files = ["LICENSE", "licenses/*", "src/sidon/web/static/vendor/lucide/LICENSE"]
dependencies = [
    "torch==2.14.1",
    "triton==3.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchaudio==2.11.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "einops==0.8.1",
    "rotary-embedding-torch==0.8.3",
    "huggingface-hub==1.28.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "pydantic==2.14.1",
]

[project.scripts]
sidon-separate = "sidon.inference.cli:main"
sidon-studio = "sidon.web.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Package only the inference runtime and its required notices.
[tool.hatch.build.targets.wheel]
only-include = ["src/sidon"]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"RUNTIME_NOTICES.md" = "sidon/inference/NOTICE.md"

[tool.hatch.build.targets.sdist]
only-include = ["src/sidon", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "RUNTIME_NOTICES.md", "THIRD_PARTY_NOTICES.md", "licenses", "docs", "tests", "scripts", "requirements.runtime.in", "requirements.runtime.txt", "Dockerfile", "compose.yaml", "VERSION", "Taskfile.yml", ".dockerignore", ".gitignore", ".python-version", ".github", "_config.yml", "site", "examples"]

[dependency-groups]
dev = ["pytest==9.0.3", "build>=1.3", "httpx==0.28.1"]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
