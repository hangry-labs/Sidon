version: '3'
vars:
  DRY_RUN: '{{.DRY_RUN | default "0"}}'
tasks:
  validate:
    desc: Check source, release transitions and publication policy without loading models
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv run --no-project --python 3.13 python -m compileall -q src scripts
      - uv run --no-project --python 3.13 --with pytest==9.0.3 --with packaging python -m pytest tests/test_packaging.py tests/test_ci_images.py tests/test_release.py tests/test_notice_hints.py tests/test_runtime_sources.py tests/test_pages.py tests/test_pages_server.py -q -p no:cacheprovider
      - node --test tests/ui/*.test.mjs
      - uv lock --check
  release:
    desc: Validate, commit and tag the release, start the next snapshot, then atomically push main and tag
    dir: '{{.TASKFILE_DIR}}'
    vars:
      NEXT_VERSION: '{{.NEXT_VERSION | default ""}}'
      SKIP_VALIDATION: '{{.SKIP_VALIDATION | default "0"}}'
    cmds:
      - pwsh -NoProfile -File scripts/release.ps1 -DryRun '{{.DRY_RUN}}' -NextVersion '{{.NEXT_VERSION}}' -SkipValidation '{{.SKIP_VALIDATION}}'
  setup:
    cmds: [uv sync --locked]
  test:
    cmds: [uv run --locked pytest -q]
  studio:
    cmds: [uv run --locked sidon-studio]
  lock-runtime:
    cmds: [pwsh -NoProfile -File scripts/lock-runtime.ps1]
  check-runtime-lock:
    cmds: [pwsh -NoProfile -File scripts/lock-runtime.ps1 -Check 1]
  build:
    cmds: [docker build --target baked -t sidon:local .]
  build-tiny:
    cmds: [docker build --target tiny -t sidon:tiny .]
  build-sources:
    cmds: [docker build --target sources -t sidon:sources .]
  up:
    cmds: [docker compose up -d --build]
  down:
    cmds: [docker compose down]
  pages-build:
    desc: Build the README website with the shared Hangry Labs theme
    cmds: [pwsh -NoProfile -File scripts/pages.ps1 build]
  pages:
    desc: Preview the project website at http://127.0.0.1:9005/Sidon/
    cmds: [pwsh -NoProfile -File scripts/pages.ps1 preview]
  pages-test:
    desc: Check public-source staging and shared website routing
    cmds:
      - uv run --locked python -m pytest tests/test_pages.py tests/test_pages_server.py -q
      - node --test tests/ui/pages-language.test.mjs
